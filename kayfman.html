<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первооткрыватель</title>
    <style>
        /* Анимированный фон (частицы) */
        #canvas-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* УВЕЛИЧЕННЫЙ ВИДЕО-БОКС */
        .video-box {
            position: relative;
            width: 100%;
            max-width: 1000px;
            max-height: 55vh; 
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            background: #000;
            margin: 0 auto 20px auto; /* Центрирование видео */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ЦВЕТОВАЯ ПАЛИТРА И ШРИФТЫ */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Roboto+Slab:wght@300;400;700&display=swap');

        :root {
            --bg-color: #020617;
            --text-color: #2b2621;
            --soviet-red: #a62b2b;
            --gold: #b8860b;
            --border-style: 3px double #a62b2b;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            font-family: 'Roboto Slab', serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #d3c7a8;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            background-color: #87CEEB;
            position: relative;
            z-index: 2;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid #c2b490;
            pointer-events: none;
        }

        header {
            text-align: center;
            border-bottom: var(--border-style);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .republic-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--soviet-red);
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin: 10px 0;
            color: var(--text-color);
        }

        .title-honor {
            font-style: italic;
            color: #444;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .action-zone {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: var(--border-style);
        }

        .btn-past {
            display: inline-block;
            background-color: var(--soviet-red);
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #731c1c;
            box-shadow: 0 4px 0 #591616;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: 'Roboto Slab', serif;
        }

        .btn-past:hover {
            background-color: #b83333;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #591616;
        }

        .btn-past:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hint-text {
            font-size: 0.85rem;
            color: #555;
            margin-top: 10px;
            font-style: italic;
        }

        /* МУЗЫКАЛЬНЫЙ ПЛЕЕР (Подсказка для звука) */
        .audio-notice {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(253, 250, 242, 0.9);
            padding: 5px 10px;
            font-size: 0.75rem;
            border: 1px solid #c2b490;
            color: #777;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<canvas id="canvas-particles"></canvas>

<div class="container">
    <header>
        <div class="republic-tag">1 июля 1878 года</div>
        <h1>генерал-адъютант Фон Кауфман</h1>
        <div class="title-honor">опубликован «Приказ по учебному ведомству» от 24 мая 1878 года </div>
    </header>

    <main>
        <div class="video-box">
            <video id="intro-vid" loop playsinline autoplay muted>
                <source src="kayfman.mp4" type="video/mp4">
            </video>
        </div>

        <div class="action-zone">
            <a href="boev.html" target="_blank" class="btn-past">
                К первому директору
            </a>
            
        </div>
    </main>
</div>

<div class="audio-notice" id="audioNotice">🔊 Кликните по экрану, чтобы включить звук видео</div>

<script>
    // --- ЧАСТИЦЫ НА ФОНЕ ---
    const canvas = document.getElementById('canvas-particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.size = Math.random() * 2 + 1;
            this.alpha = Math.random() * 0.2 + 0.05;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    // --- ЛОГИКА СНЯТИЯ МЬЮТА (ВКЛЮЧЕНИЯ ЗВУКА) ПРИ КЛИКЕ ---
    const video = document.getElementById('intro-vid');
    const notice = document.getElementById('audioNotice');

    // На всякий случай дублируем старт видео кодом, если autoplay не сработал локально
    video.play().catch(err => console.log("Автозапуск заблокирован, ждем клика..."));

    window.addEventListener('click', function() {
        if (video) {
            video.muted = false; // Включаем звук у видео
            notice.style.display = 'none'; // Скрываем подсказку
            
            // Если видео стояло на паузе из-за жестких ограничений, запускаем
            if (video.paused) {
                video.play().catch(err => console.log("Ошибка воспроизведения:", err));
            }
        }
    }, { once: true }); // Срабатывает только один раз
</script>

</body>
</html>
